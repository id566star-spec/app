<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典貪食蛇 Classic Snake</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        .score-container {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #score { color: #e94560; }
        #high-score { color: #f5b461; }

        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #16213e;
            display: block;
            border: 4px solid #0f3460;
            border-radius: 8px;
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(22, 33, 62, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #e94560;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .btn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 1rem;
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #3fba93;
            transform: scale(1.05);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #95a5a6;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>貪食蛇小遊戲</h1>
    
    <div class="score-container">
        <div>目前得分：<span id="score">0</span></div>
        <div>最高紀錄：<span id="high-score">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="game-over-screen" id="gameOverScreen">
            <div>GAME OVER</div>
            <button class="btn" onclick="resetGame()">再試一次</button>
        </div>
    </div>

    <div class="instructions">
        操作方式：使用鍵盤方向鍵 <b>↑ ↓ ← →</b> 或 <b>W A S D</b> 控制方向<br>
        提示：撞到牆壁或自己的身體就會遊戲結束！
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("gameOverScreen");

        // 遊戲格子大小與數量
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 遊戲變數
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize; // 水平速度
        let dy = 0;        // 垂直速度
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval;
        let gameSpeed = 100; // 刷新速度 (毫秒)，越小越快
        let changingDirection = false; // 防止連續按鍵導致自殺的 Bug

        highScoreEl.innerText = highScore;

        // 初始化/重設遊戲
        function resetGame() {
            snake = [
                { x: gridSize * 5, y: gridSize * 5 },
                { x: gridSize * 4, y: gridSize * 5 },
                { x: gridSize * 3, y: gridSize * 5 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreEl.innerText = score;
            gameOverScreen.style.display = "none";
            createFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        // 遊戲主循環
        function main() {
            if (hasGameEnded()) {
                gameOverScreen.style.display = "flex";
                clearInterval(gameInterval);
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // 清空畫布
        function clearCanvas() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 畫上淡淡的網格線（增加視覺質感）
            ctx.strokeStyle = "#1f305e";
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        // 畫蛇
        function drawSnake() {
            snake.forEach((part, index) => {
                // 蛇頭用鮮綠色，蛇身用漸層綠
                ctx.fillStyle = index === 0 ? "#4ecca3" : "#34a87f";
                ctx.strokeStyle = "#16213e";
                
                // 畫出帶有一點圓角的蛇身
                ctx.fillRect(part.x, part.y, gridSize - 1, gridSize - 1);
            });
        }

        // 移動蛇
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // 檢查是否吃到食物
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                createFood();
            } else {
                snake.pop(); // 沒吃到食物就移除尾巴
            }
        }

        // 隨機生成食物
        function createFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // 確保食物不會生在蛇的身上
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) createFood();
            });
        }

        // 畫出食物
        function drawFood() {
            ctx.fillStyle = "#e94560";
            // 讓食物稍微帶點圓角或圓形感
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
        }

        // 碰撞偵測
        function hasGameEnded() {
            // 撞自己
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // 撞牆
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // 監聽鍵盤事件
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const keyChar = event.key.toLowerCase();

            // 防止在單次邏輯刷新內連續按鍵導致自殺
            if (changingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            // 支援 方向鍵 與 WASD
            if ((keyPressed === 37 || keyChar === 'a') && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 38 || keyChar === 'w') && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if ((keyPressed === 39 || keyChar === 'd') && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 40 || keyChar === 's') && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }

        // 啟動遊戲
        resetGame();
    </script>
</body>
</html>
